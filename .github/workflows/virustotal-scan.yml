name: VirusTotal scan of a release

#
# Scans an already published release with the same script the release workflow runs
# between its builds and publishing - see the virustotal-scan job in build-and-release.yml.
#
# Run by hand from the Actions tab. It exists to test the script and the VT_API_KEY secret
# without making a release, to see what a release normally scores before trusting "gate"
# mode in the release workflow, and to look again later: engines update their verdicts for
# days after a file first appears. Nothing here changes the release itself.
#
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan - leave empty for the latest release'
        required: false
        default: ''
      mode:
        description: 'report: list results only / gate: also fail this run where a release would have been stopped'
        type: choice
        options:
          - report
          - gate
        default: report

permissions:
  contents: read

jobs:
  scan:
    name: VirusTotal scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "Scanning release $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir scan-assets \
            --pattern '*-Setup.exe' \
            --pattern '*.AppImage' \
            --pattern '*-Setup.pkg' \
            --pattern '*.nupkg'

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_MODE: ${{ inputs.mode }}
        run: |
          bash .github/scripts/virustotal-scan.sh "$VT_MODE" \
            scan-assets/*-Setup.exe \
            scan-assets/*.AppImage \
            scan-assets/*-Setup.pkg \
            scan-assets/*.nupkg
