name: Build, Scan and Release

#
# Releases are made by hand from the Actions tab ("Run workflow"), never by pushing a
# tag. That ordering matters: the tag is created by the final "Create GitHub Release"
# step, so it only ever comes into existence for a release that actually passed. A run
# that fails the build gate leaves nothing behind to clean up, and the same version
# number can simply be re-run once the fix is pushed.
#
# The version is not typed in here - it is read from InformationalVersion in
# Token-Burn-Rate.csproj, the same property the running app reports. AssemblyVersion
# stays purely numeric (assembly metadata rejects a "-alpha.2" suffix), so
# InformationalVersion is the one property that carries the real, possibly-suffixed
# release version - see the csproj. Bumping it before running this workflow is the only
# place a release version is entered. Pre-release status follows semver: a version with
# a "-" (e.g. "1.1.0-beta.1") is a pre-release, a bare "X.Y.Z" is a full release.
#
# Mirrors the sibling Classic-Repair-Toolbox workflow (same account, same self-hosted
# YubiKey runner). Both now package with Velopack: each RID is published unpacked and
# handed to `vpk pack`, which produces the single downloadable installer (Setup.exe /
# .AppImage / Setup.pkg) plus the .nupkg and releases feed JSON that Services/UpdateService.cs
# reads at runtime. There is still no unit-test gate here - see build-check below, which
# takes its place.
#
# Between the builds and the release, every downloadable file is scanned by VirusTotal -
# see the virustotal-scan job and the "virustotal" input, which decides whether detections
# stop the release or are only reported.
#
on:
  workflow_dispatch:
    inputs:
      # See the virustotal-scan job. "report" is the default while the thresholds are new:
      # a release or two in that mode shows what the application normally scores, before
      # "gate" is trusted to stop a release on its own.
      virustotal:
        description: 'VirusTotal scan - report: list results only / gate: also stop the release on detections / skip: no scan'
        type: choice
        options:
          - report
          - gate
          - skip
        default: report

env:
  PACK_ID: Token-Burn-Rate
  EXE_WINDOWS: Token-Burn-Rate.exe
  EXE_UNIX: Token-Burn-Rate
  PROJECT: Token-Burn-Rate.csproj
  SOLUTION: Token-Burn-Rate.slnx
  TFM: net10.0

jobs:
  ###############################################################
  # DETERMINE VERSION
  ###############################################################
  # Reads the release version straight out of the project instead of asking for it by
  # hand - see the comment at the top of this file. Every other job reads it from here
  # rather than re-deriving it, so there is exactly one place this happens.
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version from project
        id: ver
        run: |
          VERSION=$(dotnet msbuild ${{ env.PROJECT }} -getProperty:InformationalVersion -nologo)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # A version already tagged must never be released again. The release step would
      # reuse that tag and overwrite the published files under it, and every install already
      # on that version would never be offered the new build: an update has to be a higher
      # version, not the same one rebuilt. The tag is only created by a release that passed,
      # so re-running a failed release of the same version is unaffected.
      - name: Refuse a version that is already released
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # --exit-code: 0 = the tag exists, 2 = it does not, anything else = the lookup
          # itself failed, which must not pass for "not tagged".
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null
          status=$?
          set -e

          case $status in
            0) echo "::error::Version $VERSION is already tagged. Bump AssemblyVersion/InformationalVersion in ${{ env.PROJECT }} before releasing."
               exit 1 ;;
            2) echo "Version $VERSION is not tagged yet - OK to release." ;;
            *) echo "::error::Could not check whether $VERSION is already tagged (git ls-remote exit $status)."
               exit 1 ;;
          esac

  ###############################################################
  # BUILD GATE
  ###############################################################
  # Nothing gets published unless the commit being released builds clean. This proves
  # the exact commit being released is shippable - a release can be started from any
  # branch at any moment, including one that was never otherwise built in CI.
  build-check:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # SelfContained is forced on for Release in the csproj (see its comment), which
      # makes a plain "dotnet build -c Release" resolve a RuntimeIdentifier from the
      # build machine itself - linux-x64 here - that the restore above never fetched,
      # since restore ran without -c Release and picked up no RID at all. This gate only
      # needs to prove the code compiles, so self-contained resolution is turned back off
      # rather than restoring per-RID for a build whose output is discarded anyway.
      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:SelfContained=false

  ###############################################################
  # CODEQL SECURITY SCAN
  ###############################################################
  # Disabled for now: this repo is private, and CodeQL's SARIF upload requires GitHub
  # Advanced Security, which is free for public repos but not for private ones. The plan
  # is to make the repo public later, at which point flipping this "if" back on (and
  # restoring security-scan to create-release's "needs" below) is the only change needed.
  security-scan:
    if: false
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload results to GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'csharp'
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  ###############################################################
  # WINDOWS BUILD (x64, self-contained, signed)
  ###############################################################
  build-windows:
    needs: [build-check, determine-version]
    name: Build Windows (x64 self-contained, signed)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (x64)
        shell: powershell
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -f ${{ env.TFM }} `
            -r win-x64 `
            --self-contained `
            -p:Version=${{ needs.determine-version.outputs.version }} `
            -o publish/win-x64

      - name: Install vpk
        shell: powershell
        run: dotnet tool install -g vpk

      # Signing happens inside vpk pack, not around it. The workflow used to sign only the
      # main exe before packing and Setup.exe after, which left 30 of the package's 223
      # program files unsigned: the application's own code (Token-Burn-Rate.dll - the exe
      # is only .NET's small launcher), the third-party libraries their authors ship
      # unsigned, and the two programs vpk adds while packing - Squirrel.exe (the updater)
      # and the launcher stub that becomes Token-Burn-Rate.exe in the install folder, which
      # the Start menu shortcut and autostart run. Only vpk can sign those at the right
      # moment, and nothing inside the package can be signed afterwards: its SHA-256 goes
      # into the update feed. Given a template, vpk signs every .exe/.dll in the package
      # that is not already validly signed (the .NET runtime keeps Microsoft's signature),
      # then Setup.exe once it is built.
      #
      # {{file...}} hands jsign up to 10 files per run (vpk's --signParallel default), so
      # one YubiKey login covers each batch. vpk runs the template through cmd.exe, so the
      # PIN is not written into it: jsign reads it from the environment itself
      # (env:YUBIKEY_PIN), which also keeps it out of vpk's log if a signing run fails.
      - name: Pack and sign with Velopack
        shell: powershell
        env:
          YUBIKEY_PIN: ${{ secrets.YUBIKEY_PIN }}
        run: |
          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ needs.determine-version.outputs.version }} `
            --packDir publish/win-x64 `
            --mainExe ${{ env.EXE_WINDOWS }} `
            --channel win `
            --noPortable `
            --icon "Assets/icon.ico" `
            --packTitle "Token Burn Rate" `
            --signTemplate "java -jar C:\tools\jsign-6.0.jar --storetype YUBIKEY --storepass env:YUBIKEY_PIN --tsaurl http://timestamp.digicert.com --alg SHA-256 {{file...}}" `
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-win-x64
          path: velopack-output/*

  ###############################################################
  # LINUX BUILD (x64, self-contained)
  ###############################################################
  build-linux:
    needs: [build-check, determine-version]
    name: Build Linux (x64 self-contained)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM }} \
            -r linux-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/linux-x64

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Token Burn Rate" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/linux-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel linux \
            --icon "Assets/icon-256.png" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-linux-x64
          path: velopack-output/*

  ###############################################################
  # MACOS BUILD (arm64 + x64, self-contained)
  ###############################################################
  build-macos:
    needs: [build-check, determine-version]
    name: Build macOS (arm64 + x64 self-contained)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS (arm64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM }} \
            -r osx-arm64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/osx-arm64

      - name: Publish macOS (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM }} \
            -r osx-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/osx-x64

      # No .icns is committed to the repo - the runner's own iconutil builds one from the
      # PNGs Assets/render-icon.py already produces, rather than adding a second binary
      # icon format to maintain alongside icon.ico. Missing the 512px sizes iconutil wants
      # is harmless: the icon simply tops out at the largest size actually supplied.
      - name: Build .icns from existing PNGs
        run: |
          mkdir icon.iconset
          cp Assets/icon-16.png  icon.iconset/icon_16x16.png
          cp Assets/icon-32.png  icon.iconset/icon_16x16@2x.png
          cp Assets/icon-32.png  icon.iconset/icon_32x32.png
          cp Assets/icon-128.png icon.iconset/icon_32x32@2x.png
          cp Assets/icon-128.png icon.iconset/icon_128x128.png
          cp Assets/icon-256.png icon.iconset/icon_128x128@2x.png
          cp Assets/icon-256.png icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o Assets/icon.icns

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack (macOS arm64)
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Token Burn Rate" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/osx-arm64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-arm64 \
            --noPortable \
            --icon "Assets/icon.icns" \
            --outputDir velopack-output

      - name: Pack with Velopack (macOS x64)
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Token Burn Rate" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/osx-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-x64 \
            --noPortable \
            --icon "Assets/icon.icns" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-macos
          path: velopack-output/*

  ###############################################################
  # VIRUSTOTAL SCAN
  ###############################################################
  # Uploads every file a user can download or be updated to - the installers and the
  # update packages - to VirusTotal, after the builds and before anything is published.
  # The Windows files are scanned as shipped, signed. The rules live in
  # .github/scripts/virustotal-scan.sh, which .github/workflows/virustotal-scan.yml also
  # runs against an already published release.
  #
  # "gate" fails this job on detections over the script's thresholds, and since
  # create-release needs it, nothing is published: the tag only comes into existence in
  # that step, so a stopped release leaves nothing behind and can be re-run. "report"
  # scans and lists the results on the run's summary page but never stops a release, and
  # "skip" does not scan at all - the way past a false positive or a VirusTotal outage.
  #
  # Skipped step by step rather than with a job-level "if": a skipped job would take
  # create-release down with it, since a job whose needs were skipped is skipped too.
  #
  # For the same reason every step outside gate mode carries continue-on-error. The script
  # itself never fails in report mode, but a step can fail around it - an artifact that
  # will not download, or the step timeout if VirusTotal hangs - and a failed job would
  # take create-release down just the same. The script's own 45-minute budget ends it well
  # before the step's 55 and the job's 60, so normally it finishes with a result either way.
  #
  # Needs the VT_API_KEY secret - the API key of a free VirusTotal account.
  virustotal-scan:
    name: VirusTotal scan
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        if: inputs.virustotal != 'skip'
        continue-on-error: ${{ inputs.virustotal != 'gate' }}
        uses: actions/checkout@v5

      - name: Download all Velopack artifacts
        if: inputs.virustotal != 'skip'
        continue-on-error: ${{ inputs.virustotal != 'gate' }}
        uses: actions/download-artifact@v8
        with:
          path: scan-assets
          merge-multiple: true

      - name: Scan with VirusTotal
        if: inputs.virustotal != 'skip'
        continue-on-error: ${{ inputs.virustotal != 'gate' }}
        timeout-minutes: 55
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_MODE: ${{ inputs.virustotal }}
        run: |
          bash .github/scripts/virustotal-scan.sh "$VT_MODE" \
            scan-assets/*-Setup.exe \
            scan-assets/*.AppImage \
            scan-assets/*-Setup.pkg \
            scan-assets/*.nupkg

  ###############################################################
  # CREATE GITHUB RELEASE
  ###############################################################
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # security-scan is disabled (see its "if: false") until the repo goes public, so it
    # is deliberately left out of this list rather than depended on while skipped.
    needs: [determine-version, build-windows, build-linux, build-macos, virustotal-scan]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all Velopack artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set release tag
        id: tag
        run: |
          echo "tag=${{ needs.determine-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Determine if Pre-release
        id: prerelease_check
        run: |
          IS_PRE="${{ needs.determine-version.outputs.is_prerelease }}"
          VERSION="${{ steps.tag.outputs.tag }}"

          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT

          if [ "$IS_PRE" = "true" ]; then
            case "$VERSION" in
              *-alpha.*)
                STAGE_LABEL="ALPHA"
                BODY_LABEL="DEVELOPMENT"
                ;;
              *-beta.*)
                STAGE_LABEL="BETA"
                BODY_LABEL="TEST"
                ;;
              *)
                STAGE_LABEL="ALPHA"
                BODY_LABEL="DEVELOPMENT"
                ;;
            esac

            echo "release_name=$STAGE_LABEL - $VERSION" >> $GITHUB_OUTPUT
            echo "stage_label=$STAGE_LABEL" >> $GITHUB_OUTPUT
            echo "body_label=$BODY_LABEL" >> $GITHUB_OUTPUT
          else
            echo "release_name=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Takes ONLY the newest version's notes out of CHANGELOG.md - the section under the
      # first "# <version>, <date>" header, up to the next one. The whole file used to be
      # pasted in, so every release body carried the entire history back to the first one.
      #
      # The version header and the "-----" underline beneath it are both dropped: the
      # release is already titled with its version, so repeating it in the body is noise.
      #
      # Matching is on the HEADER POSITION, not on the version string. The workflow's
      # version comes from the csproj and a release is often built before the changelog's
      # own "2026-September-?" date placeholder is filled in, so requiring the two to
      # agree would fail the release over a date the maintainer is still deciding.
      #
      # CRLF is stripped first - CHANGELOG.md is maintained on Windows, and a trailing \r
      # inside the GITHUB_OUTPUT heredoc corrupts the rendered Markdown.
      #
      # Only ever reaches a release body for a FULL release; pre-releases substitute their
      # own fixed one-liner (see "Create GitHub Release" below) and never read this file at
      # all - mirrors the sibling Classic-Repair-Toolbox workflow this is taken from.
      - name: Read Changelog and append text
        id: changelog
        run: |
          # Random heredoc delimiter, not a bare "EOF". The body is file content the
          # maintainer writes, and a changelog line consisting of exactly "EOF" would end
          # the heredoc early - truncating the release body and feeding whatever followed
          # back to the runner as further step outputs.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "content<<$delim"

            if [ -f "CHANGELOG.md" ]; then
              sed 's/\r$//' CHANGELOG.md | awk '
                /^# / { if (++seen > 1) exit; next }
                seen == 1 && !body && /^-+[[:space:]]*$/ { next }
                seen == 1 { body = 1; print }
              ' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}'
            else
              echo "No CHANGELOG.md found."
            fi

            echo ""

            # No pre-release paragraph here. A pre-release never renders this output at all -
            # "Create GitHub Release" substitutes its own fixed one-liner for that case (see
            # the note above) - so building one into `content` only ever wrote text nothing
            # would read.
            echo "Do note that all versions come with the newest available **.NET 10** embedded (at build time), which means you do not need to install any .NET runtime for this."
            echo ""
            echo "You only need to install the **Token Burn Rate** application once, and thereafter you can update directly from inside the application."

            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.prerelease_check.outputs.release_name }}
          body: |
            ${{ steps.prerelease_check.outputs.is_prerelease == 'true' && format('This is a {0} version, and should not be downloaded/used unless if coordinated with the developer.', steps.prerelease_check.outputs.body_label) || format('{0}

            ### Direct downloads for different platforms
            | Platform | File |
            |----------|------|
            | Windows (x64) | [Token-Burn-Rate-win-Setup.exe](https://github.com/{1}/releases/download/{2}/Token-Burn-Rate-win-Setup.exe) |
            | Linux (x64) | [Token-Burn-Rate.AppImage](https://github.com/{1}/releases/download/{2}/Token-Burn-Rate.AppImage) |
            | macOS Apple Silicon (arm64) | [Token-Burn-Rate-osx-arm64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Token-Burn-Rate-osx-arm64-Setup.pkg) |
            | macOS Intel (x64) | [Token-Burn-Rate-osx-x64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Token-Burn-Rate-osx-x64-Setup.pkg) |',
            steps.changelog.outputs.content, github.repository, steps.tag.outputs.tag) }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*-Setup.exe
            release-assets/*.AppImage
            release-assets/*-Setup.pkg
            release-assets/*.nupkg
            release-assets/releases.*.json
            release-assets/assets.*.json

      # Leaves at most one pre-release standing, and none at all once a full release ships.
      # Deliberately ungated so one step covers both kinds of run - the "keep the current tag"
      # check is what lets a single rule do both jobs. See the Classic-Repair-Toolbox workflow
      # this is mirrored from for the fuller rationale.
      - name: Delete superseded pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.prerelease_check.outputs.is_prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Pre-release run - keeping [$CURRENT_TAG] and removing every older pre-release..."
          else
            echo "Full release [$CURRENT_TAG] - removing every pre-release..."
          fi

          gh release list \
            --repo ${{ github.repository }} \
            --limit 100 \
            --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease == true) | .tagName' \
            | while read tag; do
                if [ "$tag" = "$CURRENT_TAG" ]; then
                  echo "Keeping current pre-release: $tag"
                elif ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
                  echo "SKIPPING [$tag] - flagged as a pre-release, but not shaped like one. Refusing to delete it."
                else
                  echo "Deleting pre-release: $tag"
                  gh release delete "$tag" \
                    --repo ${{ github.repository }} \
                    --yes \
                    --cleanup-tag
                fi
              done
