<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Token Burn Rate application icon: the "quota ring" mark, the same design the tray icon
       draws live (Services/TrayIconRenderer.cs, Assets/live-ring-icon.md) - a filled arc
       around a flame, so the static app identity and the live tray icon read as one mark.

       Frozen at 65% in ClaudeAccent orange, which reads as "in use" without looking
       alarming; the static icon does not track a real bar, only the tray icon does.
       Assets/icon.ico is generated from this geometry - see the note in the README on
       regenerating it. -->

  <!-- Tile, matching the widget shell -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#1A1B1E"/>

  <!-- Track ring: the full circle, unfilled -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#3A3D44" stroke-width="26"/>

  <!-- Used arc: 65% of the circle, clockwise from 12 o'clock -->
  <path d="M 128 42 A 86 86 0 1 1 58.425 178.550"
        fill="none" stroke="#D97757" stroke-width="26" stroke-linecap="round"/>

  <!-- Flame, centred in the ring -->
  <path fill="#D97757" transform="translate(64 67) scale(0.5)" d="
    M128 22
    C 152 74, 188 96, 188 142
    C 188 184, 161 214, 128 214
    C 95 214, 68 184, 68 142
    C 68 110, 92 98, 102 64
    C 112 88, 122 78, 128 22 Z"/>
</svg>
